name: update-feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

env:
  OPENWRT_SDK_URL: "https://mirror.sjtu.edu.cn/openwrt/releases/25.12.2/targets/armsr/armv8/openwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

jobs:
  build:
    name: ${{ matrix.arch }}-${{ matrix.series }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # These names match the official sing-box OpenWrt APK assets and
        # OpenWrt package architectures used by momo's feed.
        arch:
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a9_neon
          - arm_cortex-a15_neon-vfpv4
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - aarch64_generic
          - mips_24kc
          - mips_mips32
          - mipsel_24kc
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - mips64_octeonplus
          - riscv64_generic
          - loongarch64_generic
          - i386_pentium4
          - x86_64
        # OpenWrt 24.10 uses opkg/ipk, so this APK feed starts at 25.12.
        # New branches can be added after their APK SDK and feed mapping exist.
        series:
          - "25.12"

    env:
      OPENWRT_SERIES: ${{ matrix.series }}
      ARCH: ${{ matrix.arch }}
      OUT_DIR: dist/openwrt-${{ matrix.series }}/${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y curl jq zstd

      - name: Download official sing-box APK
        run: sh ./scripts/update-release.sh

      - name: Restore OpenWrt SDK cache
        id: sdk-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/openwrt-sdk
          key: openwrt-sdk-25.12.2-armsr-armv8-apktools-${{ runner.os }}

      - name: Download and extract OpenWrt APK tooling
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 20 --max-time 300 "$OPENWRT_SDK_URL" \
            | tar --zstd -x -f - --strip-components=1 -C "$RUNNER_TEMP/openwrt-sdk"
          test -x "$RUNNER_TEMP/openwrt-sdk/staging_dir/host/bin/apk"

      - name: Sign package and build index
        env:
          APK_SIGN_PRIVATE_KEY: ${{ secrets.APK_SIGN_PRIVATE_KEY }}
        run: |
          test -n "$APK_SIGN_PRIVATE_KEY"
          printf '%s' "$APK_SIGN_PRIVATE_KEY" > "$RUNNER_TEMP/wrtbox-private-key.pem"
          APK_TOOL="$RUNNER_TEMP/openwrt-sdk/staging_dir/host/bin/apk" \
            SIGN_KEY="$RUNNER_TEMP/wrtbox-private-key.pem" \
            ARCH="$ARCH" \
            FEED_DIR="$OUT_DIR" \
            sh ./scripts/build-feed.sh
          rm -f "$RUNNER_TEMP/wrtbox-private-key.pem"

      - name: Publish signed APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path="$(find "$OUT_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          apk_name="$(basename "$apk_path")"
          version="$(printf '%s' "$apk_name" | sed -n 's/^sing-box_\([^_]*\)_openwrt_.*/\1/p')"
          test -n "$version"
          tag="sing-box-v$version"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "sing-box $version" \
              --notes "Signed official sing-box OpenWrt APK for the wrtbox feed." \
              || true
          fi
          gh release upload "$tag" "$apk_path" --repo "$GITHUB_REPOSITORY" --clobber
          rm -f "$apk_path"

      - name: Stage feed index artifact
        run: |
          mkdir -p "artifact/openwrt-${OPENWRT_SERIES}/${ARCH}"
          cp "$OUT_DIR/packages.adb" "artifact/openwrt-${OPENWRT_SERIES}/${ARCH}/packages.adb"

      - name: Upload feed index artifact
        uses: actions/upload-artifact@v7
        with:
          name: feed-${{ matrix.series }}-${{ matrix.arch }}
          path: artifact

  deploy:
    name: deploy-feed
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Download feed indexes
        uses: actions/download-artifact@v8
        with:
          pattern: feed-*
          path: dist
          merge-multiple: true

      - name: Publish public feed files
        run: |
          cp public-key.pem dist/public-key.pem
          cp scripts/feed.sh dist/feed.sh

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Deploy static feed to wrtbox Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
