name: update-feed

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC; 17:17 UTC is 01:17 Singapore time (UTC+8).
    - cron: "17 17 * * *"

permissions:
  contents: write

env:
  # Change this one value when migrating the APK server.
  WRTBOX_SERVER: 43.142.80.44
  OPENWRT_SDK_URLS: >-
    https://downloads.openwrt.org/releases/25.12.2/targets/armsr/armv8/openwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
    https://mirror.sjtu.edu.cn/openwrt/releases/25.12.2/targets/armsr/armv8/openwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  build:
    name: ${{ matrix.arch }}-${{ matrix.series }}-${{ matrix.channel }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # These names match the official sing-box OpenWrt APK assets and
        # OpenWrt package architectures used by momo's feed.
        arch:
          - aarch64_generic
          - x86_64
        # OpenWrt 24.10 uses opkg/ipk, so this APK feed starts at 25.12.
        # New branches can be added after their APK SDK and feed mapping exist.
        series:
          - "25.12"
        channel:
          - stable
          - beta

    env:
      OPENWRT_SERIES: ${{ matrix.series }}
      CHANNEL: ${{ matrix.channel }}
      ARCH: ${{ matrix.arch }}
      OUT_DIR: dist/openwrt-${{ matrix.series }}/${{ matrix.channel }}
      # apk's ${version} includes the package revision (for example 1.14.4-r0).
      # The publish step reads the exact value from the APK metadata.
      # APKs are served from the dedicated domestic static server. The feed
      # index and signing key remain on Pages.

    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y curl jq zstd

      - name: Download official sing-box APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh ./scripts/update-release.sh

      - name: Restore OpenWrt SDK cache
        id: sdk-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/openwrt-sdk
          key: openwrt-sdk-25.12.2-armsr-armv8-apktools-${{ runner.os }}

      - name: Download and extract OpenWrt APK tooling
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          sdk_archive="$RUNNER_TEMP/openwrt-sdk.tar.zst"
          downloaded=0
          for sdk_url in $OPENWRT_SDK_URLS; do
            echo "Trying OpenWrt SDK: $sdk_url"
            if curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 20 --max-time 300 "$sdk_url" \
              -o "$sdk_archive"; then
              downloaded=1
              break
            fi
            rm -f "$sdk_archive"
          done
          test "$downloaded" = 1
          tar --zstd -x -f "$sdk_archive" \
            --strip-components=1 -C "$RUNNER_TEMP/openwrt-sdk"
          rm -f "$sdk_archive"
          test -x "$RUNNER_TEMP/openwrt-sdk/staging_dir/host/bin/apk"

      - name: Sign package and build index
        env:
          APK_SIGN_PRIVATE_KEY: ${{ secrets.APK_SIGN_PRIVATE_KEY }}
        run: |
          test -n "$APK_SIGN_PRIVATE_KEY"
          key_file="$RUNNER_TEMP/wrtbox-private-key.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$APK_SIGN_PRIVATE_KEY" > "$key_file"
          server_dir="$OUT_DIR/server/$ARCH"
          direct_dir="$OUT_DIR/direct/$ARCH"
          mkdir -p "$server_dir" "$direct_dir"
          mv "$OUT_DIR"/*.apk "$server_dir/"

          APK_TOOL="$RUNNER_TEMP/openwrt-sdk/staging_dir/host/bin/apk" \
            SIGN_KEY="$key_file" \
            ARCH="$ARCH" \
            OPENWRT_SERIES="$OPENWRT_SERIES" \
            CHANNEL="$CHANNEL" \
            FEED_DIR="$server_dir" \
            PKGNAME_SPEC="http://${WRTBOX_SERVER}/${CHANNEL}/sing-box_\${version}_openwrt_\${arch}.apk" \
            sh ./scripts/build-feed.sh

          cp "$server_dir"/*.apk "$direct_dir/"
          APK_TOOL="$RUNNER_TEMP/openwrt-sdk/staging_dir/host/bin/apk" \
            SIGN_KEY="$key_file" \
            ARCH="$ARCH" \
            OPENWRT_SERIES="$OPENWRT_SERIES" \
            CHANNEL="$CHANNEL" \
            FEED_DIR="$direct_dir" \
            PKGNAME_SPEC="https://github.com/${GITHUB_REPOSITORY}/releases/download/sing-box-v\${version}/sing-box_\${version}_openwrt_\${arch}.apk" \
            sh ./scripts/build-feed.sh

      - name: Publish signed APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path="$(find "$OUT_DIR/server/$ARCH" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          apk_name="$(basename "$apk_path")"
          version="$(printf '%s' "$apk_name" | sed -n 's/^sing-box_\([^_]*\)_openwrt_.*/\1/p')"
          test -n "$version"
          # The upstream file name omits apk's package revision. Read the
          # package version from the APK so r0/r1/r2 remain automatic.
          apk_tool="$RUNNER_TEMP/openwrt-sdk/staging_dir/host/bin/apk"
          package_version="$($apk_tool adbdump "$apk_path" | sed -n 's/^[[:space:]]*version: //p' | head -n 1)"
          test -n "$package_version"
          tag="sing-box-v$package_version"
          release_asset="$RUNNER_TEMP/sing-box_${package_version}_openwrt_${ARCH}.apk"
          cp "$apk_path" "$release_asset"
          if [ "$ARCH" = "aarch64_generic" ]; then
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              title="sing-box $package_version"
              notes="Signed official sing-box OpenWrt APK for the wrtbox feed."
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                --title "$title" \
                --notes "$notes"
            fi
          else
            # Matrix jobs finish at different times. The aarch64_generic job
            # creates the release; allow the other jobs enough time to see it.
            for attempt in $(seq 1 120); do
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                break
              fi
              sleep 5
            done
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Timed out waiting for release: $tag" >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$tag" "$release_asset" --repo "$GITHUB_REPOSITORY" --clobber; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              exit 1
            fi
            sleep 5
          done
          # The upstream APK filename omits apk's package revision. Rename the
          # artifact before it is staged and uploaded so it matches the URL
          # generated from ${version} in packages.adb.
          versioned_apk="$OUT_DIR/server/$ARCH/sing-box_${package_version}_openwrt_${ARCH}.apk"
          if [ "$apk_path" != "$versioned_apk" ]; then
            mv "$apk_path" "$versioned_apk"
          fi
          rm -f "$release_asset"

      - name: Stage feed index artifact
        run: |
          mkdir -p "artifact/openwrt-${OPENWRT_SERIES}/${CHANNEL}/server/${ARCH}"
          mkdir -p "artifact/openwrt-${OPENWRT_SERIES}/${CHANNEL}/direct/${ARCH}"
          cp "$OUT_DIR/server/$ARCH/packages.adb" \
            "artifact/openwrt-${OPENWRT_SERIES}/${CHANNEL}/server/${ARCH}/packages.adb"
          cp "$OUT_DIR/direct/$ARCH/packages.adb" \
            "artifact/openwrt-${OPENWRT_SERIES}/${CHANNEL}/direct/${ARCH}/packages.adb"
          cp "$OUT_DIR/server/$ARCH"/*.apk \
            "artifact/openwrt-${OPENWRT_SERIES}/${CHANNEL}/server/${ARCH}/"

      - name: Upload feed index artifact
        uses: actions/upload-artifact@v7
        with:
          name: feed-${{ matrix.series }}-${{ matrix.channel }}-${{ matrix.arch }}
          path: artifact

  deploy:
    name: deploy-feed
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Download feed indexes
        uses: actions/download-artifact@v8
        with:
          pattern: feed-*
          path: dist
          merge-multiple: true

      - name: Publish public feed files
        run: |
          cp public-key.pem dist/public-key.pem
          cp scripts/feed.sh dist/feed.sh

      - name: Upload APKs to domestic server
        env:
          WRTBOX_SSH_PRIVATE_KEY_B64: ${{ secrets.WRTBOX_SSH_PRIVATE_KEY_B64 }}
        run: |
          test -n "$WRTBOX_SSH_PRIVATE_KEY_B64"
          key_file="$RUNNER_TEMP/wrtbox-actions-key"
          known_hosts="$RUNNER_TEMP/wrtbox-known-hosts"
          printf '%s' "$WRTBOX_SSH_PRIVATE_KEY_B64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -T 15 -H "$WRTBOX_SERVER" > "$known_hosts" 2>/dev/null

          upload_channel() {
            channel="$1"
            export CHANNEL="$channel"
            find "dist/openwrt-25.12/$channel/server" -type f -name '*.apk' -print0 |
              xargs -0 -n 1 -P 5 sh -c '
                apk_path="$1"
                for attempt in 1 2 3 4 5; do
                  if rsync -a --partial --inplace \
                    -e "ssh -i \"$KEY_FILE\" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectionAttempts=3 -o ConnectTimeout=30 -o ServerAliveInterval=30 -o UserKnownHostsFile=\"$KNOWN_HOSTS\"" \
                    "$apk_path" \
                    "ubuntu@$WRTBOX_SERVER:/srv/wrtbox/$CHANNEL/"; then
                    exit 0
                  fi
                  echo "Upload attempt $attempt failed for $CHANNEL: $apk_path; retrying"
                  sleep $((attempt * 10))
                done
                exit 1
              ' sh
          }

          export KEY_FILE="$key_file" KNOWN_HOSTS="$known_hosts"
          upload_channel stable &
          stable_pid=$!
          upload_channel beta &
          beta_pid=$!
          wait "$stable_pid"
          wait "$beta_pid"
          rm -f "$key_file" "$known_hosts"
          # APKs are served by the domestic server; Pages only receives the
          # signed index, public key, and installer script.
          find dist -type f -name '*.apk' -delete

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Deploy static feed to wrtbox Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name wrtbox
