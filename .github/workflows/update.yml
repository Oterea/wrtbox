name: update-feed

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC; 17:17 UTC is 01:17 Singapore time (UTC+8).
    - cron: "17 17 * * *"

permissions:
  contents: write

env:
  OPENWRT_SDK_URLS: >-
    https://downloads.openwrt.org/releases/25.12.2/targets/armsr/armv8/openwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
    https://mirror.sjtu.edu.cn/openwrt/releases/25.12.2/targets/armsr/armv8/openwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  build:
    name: ${{ matrix.arch }}-${{ matrix.series }}-${{ matrix.channel }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # These names match the official sing-box OpenWrt APK assets and
        # OpenWrt package architectures used by momo's feed.
        arch:
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a9_neon
          - arm_cortex-a15_neon-vfpv4
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - aarch64_generic
          - mips_24kc
          - mips_mips32
          - mipsel_24kc
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - mips64_octeonplus
          - riscv64_generic
          - loongarch64_generic
          - i386_pentium4
          - x86_64
        # OpenWrt 24.10 uses opkg/ipk, so this APK feed starts at 25.12.
        # New branches can be added after their APK SDK and feed mapping exist.
        series:
          - "25.12"
        channel:
          - stable
          - beta

    env:
      OPENWRT_SERIES: ${{ matrix.series }}
      CHANNEL: ${{ matrix.channel }}
      ARCH: ${{ matrix.arch }}
      OUT_DIR: dist/openwrt-${{ matrix.series }}/${{ matrix.channel }}/${{ matrix.arch }}
      # apk's ${version} includes the package revision (for example 1.14.4-r0).
      # The publish step reads the exact value from the APK metadata.
      # APKs are served from the dedicated domestic static server. The feed
      # index and signing key remain on Pages.
      PKGNAME_SPEC: http://43.142.80.44/${{ matrix.channel }}/sing-box_${version}_openwrt_${arch}.apk

    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y curl jq zstd

      - name: Download official sing-box APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh ./scripts/update-release.sh

      - name: Restore OpenWrt SDK cache
        id: sdk-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/openwrt-sdk
          key: openwrt-sdk-25.12.2-armsr-armv8-apktools-${{ runner.os }}

      - name: Download and extract OpenWrt APK tooling
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          sdk_archive="$RUNNER_TEMP/openwrt-sdk.tar.zst"
          downloaded=0
          for sdk_url in $OPENWRT_SDK_URLS; do
            echo "Trying OpenWrt SDK: $sdk_url"
            if curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 20 --max-time 300 "$sdk_url" \
              -o "$sdk_archive"; then
              downloaded=1
              break
            fi
            rm -f "$sdk_archive"
          done
          test "$downloaded" = 1
          tar --zstd -x -f "$sdk_archive" \
            --strip-components=1 -C "$RUNNER_TEMP/openwrt-sdk"
          rm -f "$sdk_archive"
          test -x "$RUNNER_TEMP/openwrt-sdk/staging_dir/host/bin/apk"

      - name: Sign package and build index
        env:
          APK_SIGN_PRIVATE_KEY: ${{ secrets.APK_SIGN_PRIVATE_KEY }}
        run: |
          test -n "$APK_SIGN_PRIVATE_KEY"
          key_file="$RUNNER_TEMP/wrtbox-private-key.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$APK_SIGN_PRIVATE_KEY" > "$key_file"
          APK_TOOL="$RUNNER_TEMP/openwrt-sdk/staging_dir/host/bin/apk" \
            SIGN_KEY="$key_file" \
            ARCH="$ARCH" \
            OPENWRT_SERIES="$OPENWRT_SERIES" \
            CHANNEL="$CHANNEL" \
            FEED_DIR="$OUT_DIR" \
            sh ./scripts/build-feed.sh

      - name: Publish signed APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path="$(find "$OUT_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          apk_name="$(basename "$apk_path")"
          version="$(printf '%s' "$apk_name" | sed -n 's/^sing-box_\([^_]*\)_openwrt_.*/\1/p')"
          test -n "$version"
          # The upstream file name omits apk's package revision. Read the
          # package version from the APK so r0/r1/r2 remain automatic.
          apk_tool="$RUNNER_TEMP/openwrt-sdk/staging_dir/host/bin/apk"
          package_version="$($apk_tool adbdump "$apk_path" | sed -n 's/^[[:space:]]*version: //p' | head -n 1)"
          test -n "$package_version"
          tag="sing-box-v$package_version"
          release_asset="$RUNNER_TEMP/sing-box_${package_version}_openwrt_${ARCH}.apk"
          cp "$apk_path" "$release_asset"
          if [ "$ARCH" = "aarch64_generic" ]; then
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              title="sing-box $package_version"
              notes="Signed official sing-box OpenWrt APK for the wrtbox feed."
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                --title "$title" \
                --notes "$notes"
            fi
          else
            # Matrix jobs finish at different times. The aarch64_generic job
            # creates the release; allow the other jobs enough time to see it.
            for attempt in $(seq 1 120); do
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                break
              fi
              sleep 5
            done
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Timed out waiting for release: $tag" >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$tag" "$release_asset" --repo "$GITHUB_REPOSITORY" --clobber; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              exit 1
            fi
            sleep 5
          done
          rm -f "$release_asset"

      - name: Stage feed index artifact
        run: |
          mkdir -p "artifact/openwrt-${OPENWRT_SERIES}/${CHANNEL}/${ARCH}"
          cp "$OUT_DIR/packages.adb" "artifact/openwrt-${OPENWRT_SERIES}/${CHANNEL}/${ARCH}/packages.adb"
          cp "$OUT_DIR"/*.apk "artifact/openwrt-${OPENWRT_SERIES}/${CHANNEL}/${ARCH}/"

      - name: Upload feed index artifact
        uses: actions/upload-artifact@v7
        with:
          name: feed-${{ matrix.series }}-${{ matrix.channel }}-${{ matrix.arch }}
          path: artifact

  deploy:
    name: deploy-feed
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Download feed indexes
        uses: actions/download-artifact@v8
        with:
          pattern: feed-*
          path: dist
          merge-multiple: true

      - name: Publish public feed files
        run: |
          cp public-key.pem dist/public-key.pem
          cp scripts/feed.sh dist/feed.sh

      - name: Upload APKs to domestic server
        env:
          WRTBOX_SSH_PRIVATE_KEY: ${{ secrets.WRTBOX_SSH_PRIVATE_KEY }}
          WRTBOX_SERVER: 43.142.80.44
        run: |
          test -n "$WRTBOX_SSH_PRIVATE_KEY"
          key_file="$RUNNER_TEMP/wrtbox-actions-key"
          known_hosts="$RUNNER_TEMP/wrtbox-known-hosts"
          printf '%s' "$WRTBOX_SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -T 15 -H "$WRTBOX_SERVER" > "$known_hosts" 2>/dev/null

          upload_channel() {
            channel="$1"
            source_dir="dist/openwrt-25.12/$channel"
            staging_dir="$RUNNER_TEMP/$channel-apks"
            archive="$RUNNER_TEMP/wrtbox-$channel-${GITHUB_RUN_ID}.tar.gz"
            rm -rf "$staging_dir" "$archive"
            mkdir -p "$staging_dir"
            find "$source_dir" -type f -name '*.apk' -exec cp {} "$staging_dir/" \;
            test "$(find "$staging_dir" -type f -name '*.apk' | wc -l)" -gt 0
            tar -czf "$archive" -C "$staging_dir" .
            scp -q \
              -i "$key_file" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o UserKnownHostsFile="$known_hosts" \
              "$archive" \
              "ubuntu@$WRTBOX_SERVER:/tmp/"
            ssh \
              -i "$key_file" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o UserKnownHostsFile="$known_hosts" \
              "ubuntu@$WRTBOX_SERVER" \
              "tar -xzf /tmp/$(basename "$archive") -C /srv/wrtbox/$channel && rm -f /tmp/$(basename "$archive")"
          }

          upload_channel stable
          upload_channel beta
          rm -f "$key_file" "$known_hosts"

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Deploy static feed to wrtbox Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name wrtbox
