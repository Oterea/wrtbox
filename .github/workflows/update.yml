name: update-feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  OPENWRT_SERIES: "25.12"
  OPENWRT_SDK_URL: "https://downloads.openwrt.org/releases/25.12.2/targets/armsr/armv8/openwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ARCH: aarch64_generic
      OUT_DIR: dist/openwrt-25.12/aarch64_generic
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y curl jq zstd

      - name: Download official sing-box APK
        run: sh ./scripts/update-release.sh

      - name: Download OpenWrt APK tooling
        run: |
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          curl --fail --location --silent --show-error "$OPENWRT_SDK_URL" \
            | tar --zstd -x -f - --strip-components=1 -C "$RUNNER_TEMP/openwrt-sdk"
          test -x "$RUNNER_TEMP/openwrt-sdk/staging_dir/host/bin/apk"

      - name: Sign packages and build index
        env:
          APK_SIGN_PRIVATE_KEY: ${{ secrets.APK_SIGN_PRIVATE_KEY }}
        run: |
          test -n "$APK_SIGN_PRIVATE_KEY"
          printf '%s' "$APK_SIGN_PRIVATE_KEY" > "$RUNNER_TEMP/wrtbox-private-key.pem"
          cp public-key.pem dist/public-key.pem
          APK_TOOL="$RUNNER_TEMP/openwrt-sdk/staging_dir/host/bin/apk" \
            SIGN_KEY="$RUNNER_TEMP/wrtbox-private-key.pem" \
            ARCH="$ARCH" \
            FEED_DIR="$OUT_DIR" \
            sh ./scripts/build-feed.sh
          rm -f "$RUNNER_TEMP/wrtbox-private-key.pem"

      - name: Deploy static feed to wrtbox Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
